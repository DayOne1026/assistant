[project]
name = "assistant"
version = "0.1.0"
description = "多用户 AI 私人助理平台（求职展示项目）"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.*",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg",
    "bcrypt",  # 02 密码散列
    "alembic",
    "pydantic==2.7.*",
    "pydantic-settings",
    "redis==5.*",
    "neo4j==5.*",
    "langchain==0.2.*",
    "langchain-community==0.2.*",
    "openai",  # DeepSeek 走 OpenAI 兼容端点所需（langchain-community 0.2 无原生 ChatDeepSeek）
    "langgraph==0.2.*",
    "langgraph-checkpoint==2.1.*",  # 04b RedisSaver checkpointer（langgraph 0.2 配 <3.0.0）
    "langgraph-checkpoint-redis==0.1.3",  # RedisSaver（0.2+ 硬要 checkpoint 3.x，与 langgraph 0.2 冲突）
    "redisvl==0.5.1",  # checkpoint-redis 0.1.3 配套同步 SearchIndex（0.11+ async API 不兼容）
    "celery==5.*",
    "pgvector",
    "jsonschema",  # 11 工具参数 JSON Schema 校验
    "opentelemetry-api",
    "opentelemetry-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# session 级 async fixture（engine/redis）与测试同 loop，避免跨 loop 连接
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
