[project]
name = "assistant"
version = "0.1.0"
description = "多用户 AI 私人助理平台（求职展示项目）"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.*",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg",
    "alembic",
    "pydantic==2.7.*",
    "pydantic-settings",
    "redis==5.*",
    "neo4j==5.*",
    "langchain==0.2.*",
    "langchain-community==0.2.*",
    "openai",  # DeepSeek 走 OpenAI 兼容端点所需（langchain-community 0.2 无原生 ChatDeepSeek）
    "langgraph==0.2.*",
    "celery==5.*",
    "pgvector",
    "opentelemetry-api",
    "opentelemetry-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
